<main class="auth-shell">
  <section class="auth-card">
    <div class="auth-header">
      <span class="brand">A</span>
      <h1>Mot de passe oublié</h1>
    </div>

    <p class="subtitle">Saisissez votre e-mail pour recevoir un code de récupération.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="exemple@email.com" autocomplete="email">
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small>Adresse email invalide.</small>
        }
      </div>

      @if (error) {
        <div class="error" role="alert">{{ error }}</div>
      }

      @if (success) {
        <div class="success" role="status">{{ success }}</div>
      }

      <button class="submit-button" type="submit" [disabled]="loading">
        {{ loading ? 'Envoi...' : 'Recevoir le code' }}
      </button>
    </form>

    <a class="back-link" routerLink="/auth">Retour à la connexion</a>
  </section>
</main>
